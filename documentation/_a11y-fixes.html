<script>
// Quarto renders ORCID icons as icon-only links: give them an accessible name
// and mark the icon image as decorative.
var ORCID_SVG = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><circle cx="128" cy="128" r="128" fill="#A6CE39"/><path fill="#fff" d="M86.3 186.2H70.9V79.1h15.4v107.1zM108.9 79.1h41.6c39.6 0 57 28.3 57 53.6 0 27.5-21.5 53.6-56.8 53.6h-41.8V79.1zm15.4 93.3h24.5c34.9 0 42.9-26.5 42.9-39.7C191.7 111.2 178 93 148 93h-23.7v79.4zM88.7 56.8c0 5.5-4.5 10.1-10.1 10.1s-10.1-4.6-10.1-10.1c0-5.6 4.5-10.1 10.1-10.1s10.1 4.6 10.1 10.1z"/></svg>');
document.querySelectorAll('a.quarto-title-author-orcid').forEach(function (a) {
  var name = a.closest('p') || a.parentElement;
  var who = name ? name.textContent.trim().replace(/\s+/g, ' ') : '';
  a.setAttribute('aria-label', 'ORCID profile' + (who ? ' of ' + who : ''));
  // Swap Quarto's 16 px PNG for the vector iD so it stays sharp on high-density screens.
  a.querySelectorAll('img').forEach(function (img) { img.setAttribute('alt', ''); img.src = ORCID_SVG; });
});
</script>
