project:
  type: book
  output-dir: _book
  # Tutorial videos are referenced from raw HTML, which Quarto does not scan.
  resources:
    - static/videos/*

book:
  description: "How to use SysNDD, the expert-curated database of gene-disease relationships in neurodevelopmental disorders: finding genes, building panels, the API, the curation criteria and the curator workflows."
  title: "The SysNDD Documentation"
  author:
    - name: "Bernt Popp"
      orcid: "0000-0002-3679-1081"
    - name: "Melek Firat Altay"
    - name: "Simon Früh"
    - name: "Christiane Zweier"
      orcid: "0000-0001-8002-2020"
  date: last-modified
  date-format: "YYYY-MM-DD"

  repo-url: https://github.com/berntpopp/sysndd
  repo-branch: master
  repo-subdir: documentation
  repo-actions: [edit, source, issue]

  favicon: static/img/favicon/sysndd-favicon-192.png
  cover-image: static/img/brand/sysndd-logo.svg

  # Download buttons for PDF and EPUB
  downloads: [pdf, epub]

  # Social sharing
  sharing: [twitter, facebook, linkedin]

  # Search enabled
  search: true

  # Sidebar: floating, so the page grid is centred on wide screens; SysNDD logo
  # and a persistent link to the app.
  sidebar:
    style: floating
    logo: static/img/brand/sysndd-logo.svg
    logo-alt: "SysNDD logo"
    tools:
      - icon: box-arrow-up-right
        href: https://sysndd.dbmr.unibe.ch/
        text: "Open SysNDD"
      - icon: braces
        href: https://sysndd.dbmr.unibe.ch/API
        text: "API (Swagger)"

  # Chapter structure. Existing NN- filenames are kept: their URLs are cited
  # externally (the manuscript cites 05-curation-criteria.html).
  chapters:
    - index.qmd
    - part: "Getting started"
      chapters:
        - 01-intro.qmd
    - part: "Using SysNDD"
      chapters:
        - 02-web-tool.qmd
        - using-find-gene.qmd
        - using-panels.qmd
        - using-phenotype-search.qmd
        - using-analyses.qmd
        - using-account.qmd
        - 03-api.qmd
    - part: "Curation"
      chapters:
        - 05-curation-criteria.qmd
        - curation-research.qmd
        - 06-re-review-instructions.qmd
        - 07-tutorial-videos.qmd
    - part: "Curator guide"
      chapters:
        - curator-create-entity.qmd
        - curator-modify-entity.qmd
        - curator-approve.qmd
        - curator-manage-rereview.qmd
        - curator-users.qmd
        - curator-genereviews-variation.qmd
    - part: "Reference"
      chapters:
        - 04-database-structure.qmd
        - reference-citing.qmd
        - reference-glossary.qmd
        - references.qmd
    - part: "For developers"
      chapters:
        - 08-development.qmd
        - 09-deployment.qmd

  # Previous/next links at the bottom of each page
  page-navigation: true
  back-to-top-navigation: true

  # Page footer
  page-footer:
    left: |
      SysNDD: expert-curated gene-disease associations for neurodevelopmental disorders
    right: |
      <a href="https://sysndd.dbmr.unibe.ch/">Open SysNDD</a> ·
      <a href="https://github.com/berntpopp/sysndd">GitHub</a> ·
      Data CC BY 4.0

# Figure and table numbers without chapter prefix: chapter numbers are hidden on
# the web, so "Figure 12.5" would point to a number the reader never sees.
crossref:
  chapters: false

# Bibliography configuration
bibliography: sysndd.bib
csl: apa.csl

# HTML format options
format:
  html:
    theme:
      light: [cosmo, theme.scss]
    css: styles.css
    # One source of truth for the page grid (centred by the floating sidebar).
    grid:
      sidebar-width: 280px
      body-width: 800px
      margin-width: 240px
      gutter-width: 2rem
    include-after-body: _a11y-fixes.html
    include-in-header: _head-preload.html
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    # Unnumbered on the web: chapter numbers would no longer match the
    # NN- filenames after the restructure. See docs style guide.
    number-sections: false
    anchor-sections: true
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
    fig-cap-location: bottom

  # PDF format for download
  pdf:
    documentclass: scrreprt
    papersize: a4
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    link-citations: true
    keep-tex: false
    include-in-header:
      - text: |
          \usepackage{fvextra}
          \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}

  # EPUB format for e-readers
  epub:
    toc: true
    toc-depth: 2
    number-sections: true
    cover-image: static/img/SysNDD_brain-dna-magnifying-glass_dall-e_logo.webp

# Language setting for proper encoding
lang: en
